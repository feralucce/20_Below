# Cloudflare Worker config for the 20 Below bug relay. See README.md.
name = "20below-bugs"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Pages allowed to send reports: the website and web tools, both Owlbear
# extensions (they share the github.io origin), the desktop apps on
# Windows and macOS, and the local preview server used for testing.
ALLOWED_ORIGINS = "https://20belowrpg.com,https://www.20belowrpg.com,https://feralucce.github.io,http://tauri.localhost,https://tauri.localhost,tauri://localhost,http://localhost:8792"
# The id of the forum channel's "New" tag, filled in during setup (step 4).
NEW_TAG_ID = ""

# Ticket counter and rate limits. Replace the id after `wrangler kv namespace create TICKETS`.
[[kv_namespaces]]
binding = "TICKETS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
