# Cloudflare Worker config for the 20 Below bug relay. See README.md.
name = "20below-bugs"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Pages allowed to send reports: the website and web tools, both Owlbear
# extensions (they share the github.io origin), the desktop apps on
# Windows and macOS, and the local preview server used for testing.
ALLOWED_ORIGINS = "https://20belowrpg.com,https://www.20belowrpg.com,https://feralucce.github.io,http://tauri.localhost,https://tauri.localhost,tauri://localhost,http://localhost:8792"
# The id of the forum channel's "New" tag, filled in during setup (step 4).
NEW_TAG_ID = "1554503018014310430"
# The Kit form that newsletter signups join (README.md, "Email signups").
# Empty means signups are only kept in SUBSCRIBERS.
KIT_FORM_ID = "9984113"
# Playtest feedback (playtest.js): forum tag name -> tag id in the private
# #playtest-feedback forum. Names left out are not applied.
PLAYTEST_TAGS = '''{"New":"1554879670116155463","Discussing":"1554879695852413040","Changed":"1554879723211980872","Won't change":"1554879748084342824","Unclear rule":"1554879782964035645","Too slow":"1554879810415755356","Balance":"1554879848244318328","Not fun":"1554879872189599824","Tool issue":"1554879893404254238","Session report":"1554879920826753116","Detailed":"1555215582046195962"}'''

# Ticket counter and rate limits. Replace the id after `wrangler kv namespace create TICKETS`.
[[kv_namespaces]]
binding = "TICKETS"
id = "02b033d154784321ad46249d2dba3f50"

# Email signups: every address, whether or not it has reached Kit yet.
# Export them with `node export-subscribers.mjs` (README.md, "Email signups").
[[kv_namespaces]]
binding = "SUBSCRIBERS"
id = "169c3c737e0842208c81665bb0b5d6f4"
