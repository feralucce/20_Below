<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>20 Below - Character Creator</title>
<link rel="icon" type="image/x-icon" href="../docs/assets/brand/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="../docs/assets/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a1720" />
<!-- iOS ignores the manifest for standalone mode and reads these instead. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="20 Below" />
<link rel="stylesheet" href="style.css" />
<script src="../vendor/marked.min.js"></script>
<script>
  // Only on the web. The desktop build loads this same page through
  // Tauri, which on Windows serves from http://tauri.localhost - so the
  // protocol alone does not tell the two apart. A worker registered there
  // would cache the app shell inside the installer's own origin and could
  // keep serving the old one after an update, so Tauri is excluded by name.
  if ("serviceWorker" in navigator
      && location.protocol.startsWith("http")
      && !window.__TAURI__
      && !location.hostname.endsWith("tauri.localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // No offline support this visit; the app still works online.
      });
    });
  }
</script>
</head>
<body>
<header class="app-header">
  <div class="header-links">
    <a class="file-link" href="https://20belowrpg.com/home.html" target="_blank" rel="noopener">&larr; 20 Below Website</a>
    <button id="btn-save" type="button" class="file-link">Save</button>
    <button id="btn-import" type="button" class="file-link">Import</button>
    <select id="load-select" class="file-link" aria-label="Load a saved character"></select>
    <button id="btn-export" type="button" class="file-link">Export</button>
    <button id="btn-edit" type="button" class="file-link">Character Creator</button>
    <button id="btn-new" type="button" class="file-link new-btn">New Character</button>
  </div>
  <div class="header-brand">
    <h1><img src="../docs/assets/brand/favicon-32.png" alt="" width="28" height="28" class="header-icon" /> 20 Below</h1>
    <p class="subtitle">Character Creator</p>
    <p id="version-led" class="version-led" hidden></p>
    <p id="rules-led" class="version-led" hidden></p>
    <button type="button" id="get-update" class="get-update" hidden>Get the update</button>
    <p id="app-version" class="app-version"></p>
  </div>
  <p id="file-status" class="file-status-line" hidden></p>
</header>

<nav id="step-nav" class="step-nav" aria-label="Character creation steps"></nav>

<main id="step-panel" class="step-panel">
  <p class="loading">Loading rules data&hellip;</p>
</main>

<footer class="wizard-controls">
  <button id="btn-back" type="button">Back</button>
  <div id="pool-summary" class="pool-summary"></div>
  <button id="btn-npc" type="button" hidden title="Finish, and remove every point this character has not spent">Finish as NPC</button>
  <button id="btn-next" type="button">Next</button>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
