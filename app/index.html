<script>
  // If the app's code fails to load - a file that will not parse, or two
  // files from different releases that do not fit together - the page used
  // to sit on "Loading rules data..." for ever. Say so instead, once, with
  // what to do about it.
  window.addEventListener("error", (e) => {
    if (window.__creatorStarted || document.querySelector(".load-failure")) return;
    const box = document.createElement("div");
    box.className = "load-failure";
    box.setAttribute("role", "alert");
    box.innerHTML = "<p><strong>The Character Creator did not finish loading.</strong></p>"
      + "<p>Reload the page with Ctrl+Shift+R. If this stays, send this message.</p>";
    const reason = document.createElement("p");
    reason.className = "load-failure-reason";
    reason.textContent = "Reason: " + (e.message || "a script failed to load");
    box.appendChild(reason);
    (document.getElementById("step-panel") || document.body).prepend(box);
  }, true);
</script>
<script>
  // Only on the web. The desktop build loads this same page through
  // Tauri, which on Windows serves from http://tauri.localhost - so the
  // protocol alone does not tell the two apart. A worker registered there
  // would cache the app shell inside the installer's own origin and could
  // keep serving the old one after an update, so Tauri is excluded by name.
  if ("serviceWorker" in navigator
      && location.protocol.startsWith("http")
      && !window.__TAURI__
      && !location.hostname.endsWith("tauri.localhost")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // No offline support this visit; the app still works online.
      });
    });
  }
</script>
