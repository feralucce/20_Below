<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>20 Below - Character Creator</title>
<link rel="icon" type="image/x-icon" href="../docs/assets/brand/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="../docs/assets/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a1720" />
<!-- iOS ignores the manifest for standalone mode and reads these instead. -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="20 Below" />
<link rel="stylesheet" href="style.css" />
<script src="../vendor/marked.min.js"></script>
<script>
  // Only on the web. The desktop build loads this same page through
  // Tauri, where there is nothing to install and no network layer to
  // cache - registering there would fail loudly for no benefit.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {
        // No offline support this visit; the app still works online.
      });
    });
  }
</script>
</head>
<body>
<header class="app-header">
  <button id="btn-reset" type="button" class="reset-btn">Reset</button>
  <div class="header-links">
    <a class="file-link" href="https://20belowrpg.com/home.html" target="_blank" rel="noopener">&larr; 20 Below</a>
    <a href="file.html" class="file-link">Save / Load / Import</a>
  </div>
  <h1><img src="../docs/assets/brand/favicon-32.png" alt="" width="28" height="28" class="header-icon" /> 20 Below</h1>
  <p class="subtitle">Character Creator</p>
  <p id="version-led" class="version-led" hidden></p>
  <p id="rules-led" class="version-led" hidden></p>
  <button type="button" id="get-update" class="get-update" hidden>Get the update</button>
  <p id="app-version" class="app-version"></p>
</header>

<nav id="step-nav" class="step-nav" aria-label="Character creation steps"></nav>

<main id="step-panel" class="step-panel">
  <p class="loading">Loading rules data&hellip;</p>
</main>

<footer class="wizard-controls">
  <button id="btn-back" type="button">Back</button>
  <div id="pool-summary" class="pool-summary"></div>
  <button id="btn-next" type="button">Next</button>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
