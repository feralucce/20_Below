<script type="module">
// A harness for looking at the paged sheet with a real character in it,
// without walking the whole creator. Not linked from the app.
import { loadRulesData } from './rules-data.js';
import { createInitialState, mergeCharacterState } from './state.js';
import sheetStep from './steps/13-sheet.js';

const root = document.getElementById('root');
const params = new URLSearchParams(location.search);
const who = params.get('c') || 'Viktor Grave';

const data = await loadRulesData();
let state = createInitialState(data);
try {
  const res = await fetch(`./sheet/sample/${encodeURIComponent(who)}.json`);
  if (res.ok) state = mergeCharacterState(data, await res.json());
} catch (err) {
  console.warn('no sample character, showing a blank sheet', err);
}
root.innerHTML = '';
await sheetStep.render(root, { state, data, persist: () => {} });
</script>
