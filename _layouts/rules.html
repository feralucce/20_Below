<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ page.name | remove: ".md" | replace: "-", " " | capitalize }} | 20 Below</title>
{% include brand-head.html %}
<style>
  /* Colour, type and the shared components live in
     docs/assets/css/20below.css. What is left here is
     this page's own. */
  /* This page's own measure - how wide its text column
     runs is a decision about this page, not the brand. */
  :root { --measure: 900px; }

  body {
    min-height: 100vh;
  }
  main {
    line-height: 1.6;
  }
  .back-link {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
  h1, h2, h3, h4 {
    letter-spacing: 0.02em;
  }
  h4 {
    margin-top: 1.5rem;
  }
  p, li {
    color: var(--text);
  }
  strong { color: var(--text); }
  hr {
    border: none;
    border-top: 1px solid var(--panel-border);
    margin: 2.5rem 0;
  }
  code {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    font-size: 0.9em;
    padding: 0.1rem 0.35rem;
  }
  table {
    font-size: 0.95rem;
  }
  th, td {
    border: 1px solid var(--panel-border);
    padding: 0.5rem 0.7rem;
    text-align: left;
    vertical-align: top;
  }
  th {
    background: var(--panel);
    color: var(--text);
  }
  tr:nth-child(even) td {
    background: rgba(255, 255, 255, 0.02);
  }
  img {
    max-width: 100%;
    height: auto;
    display: block;
    border-radius: var(--radius);
    border: 1px solid var(--panel-border);
  }
  table.adversary-card {
    width: 100%;
    border-collapse: separate;
    margin: 1.5rem 0;
    font-size: 1rem;
  }
  table.adversary-card td {
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    vertical-align: top;
  }
  table.adversary-card:nth-of-type(odd) td {
    background: var(--panel);
  }
  table.adversary-card:nth-of-type(even) td {
    background: var(--bg);
  }
  /* The adversary index nests entries under a family heading, so a card's
     own title is an h4 there and an h3 elsewhere. Both, or the title picks
     up the top margin meant to separate sections. */
  table.adversary-card h3,
  table.adversary-card h4 {
    margin-top: 0;
    /* A creature's name is what a reader scans for, so it keeps the accent
       an h3 gets by default even though it is an h4 inside a family. */
    color: var(--accent);
  }
</style>
</head>
<body>
{% include site-nav.html %}
<main id="main">
  <a class="back-link" href="/home.html">&larr; Back to 20 Below</a>
  {{ content }}
</main>
<script src="/docs/assets/js/site-nav.js"></script>
<!-- Sets the Skill List as cards. The markdown keeps the table, which
     is what the character creator and the desktop app parse; this is
     the reading view, and with scripting off the table stands. -->
<script src="/docs/assets/js/skill-cards.js"></script>
</body>
</html>
