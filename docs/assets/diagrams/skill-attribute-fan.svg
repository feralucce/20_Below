<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Every Skill defaults to an Attribute/Element</title>
<desc>Every Skill has a default Attribute/Element - shown here as Fire, solid-lined. A player can challenge the default and pair the Skill with a different Attribute instead (dashed lines), as long as the pairing is grounded in one of the character's own Descriptors.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
<marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e0685c"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="50" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Your Skill</text>

<line x1="340" y1="70" x2="90" y2="132" stroke="#5c7d92" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="220" y2="132" stroke="#5c7d92" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="340" y2="132" stroke="#e0685c" stroke-width="2.5" marker-end="url(#arrow-default)"/>
<line x1="340" y1="70" x2="460" y2="132" stroke="#5c7d92" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="590" y2="132" stroke="#5c7d92" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<rect x="35" y="134" width="110" height="50" rx="8" fill="#2e2717" stroke="#c9a86b" stroke-width="1"/>
<text x="90" y="159" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#c9a86b">Earth</text>

<rect x="165" y="134" width="110" height="50" rx="8" fill="#16283a" stroke="#6fb8e0" stroke-width="1"/>
<text x="220" y="159" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#6fb8e0">Air</text>

<rect x="285" y="134" width="110" height="50" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="2.5"/>
<text x="340" y="159" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#e0685c">Fire</text>

<rect x="405" y="134" width="110" height="50" rx="8" fill="#16281f" stroke="#5cc9b0" stroke-width="1"/>
<text x="460" y="159" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#5cc9b0">Water</text>

<rect x="535" y="134" width="110" height="50" rx="8" fill="#241a33" stroke="#a37ae0" stroke-width="1"/>
<text x="590" y="159" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#a37ae0">Moira</text>

<text x="340" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#e0685c">default</text>
<text x="340" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">challenging the default needs one of your Descriptors</text>
</svg>
