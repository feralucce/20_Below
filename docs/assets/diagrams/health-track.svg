<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Health Levels are discrete hit-boxes</title>
<desc>Health Levels are a row of boxes, each absorbing one hit. Once all are lost, further damage pushes into negative territory rather than a hard stop.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<text x="75" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">negative</text>
<text x="75" y="71" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">territory</text>
<line x1="120" y1="55" x2="172" y2="55" stroke="#5c7d92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="180" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="262" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="344" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="426" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="508" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>

<line x1="180" y1="95" x2="180" y2="105" stroke="#5c7d92" stroke-width="1"/>
<text x="180" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">0</text>
<text x="180" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">unconscious</text>

<text x="543" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">5 + Health</text>
<text x="543" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">full Health Levels</text>
</svg>
