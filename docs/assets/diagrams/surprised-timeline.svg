<svg width="680" height="140" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Surprised lasts exactly one round</title>
<desc>Surprised imposes Disadvantage on everything for the remainder of the round it triggers in, then clears automatically once that round ends - no roll needed.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<line x1="60" y1="70" x2="600" y2="70" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<circle cx="60" cy="70" r="6" fill="#e0685c"/>
<rect x="10" y="90" width="150" height="40" rx="6" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="85" y="105" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">Surprised</text>
<text x="85" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#f0a89c">Disadvantage on everything</text>

<circle cx="600" cy="70" r="6" fill="#6fbf73"/>
<rect x="520" y="90" width="150" height="40" rx="6" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="595" y="105" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">Round Ends</text>
<text x="595" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="10" fill="#8fd4a0">clears automatically</text>

<text x="340" y="45" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">the rest of this one round</text>
</svg>
