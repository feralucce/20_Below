<svg width="880" height="600" viewBox="0 0 880 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wealth at Character Creation flow</title>
<desc>Pick an item, find the gap between its Wealth rating and current creation-Wealth. If the gap is more than creation-Wealth, the item can't be afforded at all - no roll. Otherwise, roll a Wealth Check: 2d10 against creation-Wealth plus 6, roll-under. Success means the item is free. Failure still gets the item, but creation-Wealth drops by the gap, floored at 1, doubled on a catastrophic failure.</desc>
<defs>
<marker id="arrow-wc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="320" y="20" width="240" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="440" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Pick an Item to Buy</text>

<line x1="440" y1="76" x2="440" y2="106" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>

<rect x="260" y="108" width="360" height="64" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="440" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Find the Gap</text>
<text x="440" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">Item's Wealth &minus; current creation-Wealth</text>

<line x1="440" y1="172" x2="440" y2="202" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>

<rect x="250" y="204" width="380" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="440" y="232" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Is the gap more than creation-Wealth?</text>

<line x1="360" y1="260" x2="180" y2="298" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>
<line x1="540" y1="260" x2="700" y2="298" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>

<rect x="40" y="300" width="280" height="64" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="180" y="322" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Yes - Can't Afford</text>
<text x="180" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">No roll - try something cheaper</text>

<rect x="530" y="300" width="330" height="64" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="695" y="322" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">No - Roll a Wealth Check</text>
<text x="695" y="340" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">2d10 vs. creation-Wealth + 6, roll-under</text>

<line x1="700" y1="364" x2="700" y2="394" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>

<line x1="640" y1="410" x2="520" y2="440" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>
<line x1="760" y1="410" x2="800" y2="440" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow-wc)"/>

<rect x="380" y="442" width="280" height="56" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="520" y="464" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Success</text>
<text x="520" y="482" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">Item is free and clear</text>

<rect x="620" y="442" width="260" height="90" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="750" y="464" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Failure</text>
<text x="750" y="482" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">Item acquired anyway</text>
<text x="750" y="500" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">Creation-Wealth drops by the gap</text>
<text x="750" y="516" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">(min 1, &times;2 on a catastrophic failure)</text>
</svg>
