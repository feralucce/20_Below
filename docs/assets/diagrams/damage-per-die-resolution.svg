<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Physical attack per-die resolution mechanic</title>
<desc>A weapon sets how many d10 are rolled on a hit, resolved against the defender's Soak - in this example, Soak 6. Each die is compared individually: a result at or below Soak is absorbed with no effect, a result above Soak connects and costs one Health Level.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="270" y="20" width="140" height="54" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Weapon rating</text>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">sets number of d10 rolled</text>

<line x1="340" y1="74" x2="340" y2="108" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="270" y="108" width="140" height="54" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Soak 6</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">what each die must beat</text>

<line x1="340" y1="162" x2="340" y2="196" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">each die resolved individually against Soak</text>

<rect x="170" y="228" width="70" height="46" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="205" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">d10 = 3</text>

<rect x="260" y="228" width="70" height="46" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="295" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">d10 = 9</text>

<rect x="350" y="228" width="70" height="46" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="385" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">d10 = 6</text>

<rect x="440" y="228" width="70" height="46" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="475" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">d10 = 10</text>

<line x1="205" y1="274" x2="190" y2="358" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="385" y1="274" x2="260" y2="358" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="295" y1="274" x2="470" y2="358" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="475" y1="274" x2="490" y2="358" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="358" width="260" height="56" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="190" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">result &#8804; Soak: absorbed</text>
<text x="190" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">no effect</text>

<rect x="360" y="358" width="260" height="56" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="490" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">result &gt; Soak: connects</text>
<text x="490" y="396" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">costs 1 Health Level</text>
</svg>
