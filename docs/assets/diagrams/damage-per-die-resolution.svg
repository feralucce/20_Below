<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Damage's per-die resolution mechanic</title>
<desc>Damage sub-stat sets how many d10 are rolled on a hit. Each die is compared individually against the defender's Soak: a result at or below Soak is absorbed with no effect, a result above Soak connects and costs one Health Level.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#888780"/>
</marker>
</defs>

<rect x="270" y="20" width="140" height="54" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Damage rating</text>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">sets number of d10 rolled</text>

<line x1="340" y1="74" x2="340" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">each die resolved individually vs Soak (example: Soak 6)</text>

<rect x="170" y="140" width="70" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="205" y="163" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">d10 = 3</text>

<rect x="260" y="140" width="70" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="295" y="163" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">d10 = 9</text>

<rect x="350" y="140" width="70" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="385" y="163" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">d10 = 6</text>

<rect x="440" y="140" width="70" height="46" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="475" y="163" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">d10 = 10</text>

<line x1="205" y1="186" x2="190" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="385" y1="186" x2="260" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="295" y1="186" x2="470" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="475" y1="186" x2="490" y2="270" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="280" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="190" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">result &#8804; Soak: absorbed</text>
<text x="190" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">no effect</text>

<rect x="360" y="280" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">result &gt; Soak: connects</text>
<text x="490" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">costs 1 Health Level</text>
</svg>
