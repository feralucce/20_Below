<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Using a Gift draws on three tools</title>
<desc>Using a Gift can call for a roll reusing an existing resolution type, a direct Ki cost, or a Gift Check against current Ki. Not every Gift uses all three.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="50" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">Using a Gift</text>

<line x1="340" y1="70" x2="140" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="340" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="540" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="134" width="180" height="60" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="140" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">A Roll</text>
<text x="140" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">reuses an existing type</text>

<rect x="250" y="134" width="180" height="60" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">Ki Cost</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">direct spend, no roll</text>

<rect x="450" y="134" width="180" height="60" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="540" y="158" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">Gift Check</text>
<text x="540" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">2d10 vs. current Ki</text>

<text x="340" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">not every Gift uses all three - check the Gift's own text</text>
</svg>
