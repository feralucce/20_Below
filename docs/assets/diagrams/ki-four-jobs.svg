<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Ki's four jobs</title>
<desc>Ki serves as the target number for a Fatigue Check, and can be directly spent three ways: to preserve a Health or Sanity Level, to bump an Action Bracket up a step, or to boost an attack die via Ki Infusion.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="290" y="20" width="100" height="50" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1"/>
<text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#eaf5fb">Ki</text>

<line x1="340" y1="70" x2="85" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="255" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="425" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="70" x2="595" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="10" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="85" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Fatigue Check</text>
<text x="85" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">target number</text>

<rect x="180" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="255" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Preserve a Level</text>
<text x="255" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">Health or Sanity</text>

<rect x="350" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="425" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Bump a Bracket</text>
<text x="425" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">1 Ki per step</text>

<rect x="520" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="595" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Boost a Die</text>
<text x="595" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">Ki Infusion</text>

<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">only the Fatigue Check risks losing Ki - the other three are direct spends</text>
</svg>
