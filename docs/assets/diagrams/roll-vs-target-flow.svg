<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Roll vs. Target: success and failure</title>
<desc>Roll 2d10 and sum them against a target number. A result equal to or lower than the target is a success; higher than the target is a failure.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Target Number</text>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#eaf5fb">14</text>

<line x1="290" y1="76" x2="210" y2="112" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="76" x2="470" y2="112" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="100" y="114" width="220" height="70" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="210" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Roll: 12</text>
<text x="210" y="154" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">12 &#8804; 14</text>
<text x="210" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#8fd4a0">SUCCESS</text>

<rect x="360" y="114" width="220" height="70" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="470" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Roll: 16</text>
<text x="470" y="154" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">16 &gt; 14</text>
<text x="470" y="172" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="700" fill="#f0a89c">FAILURE</text>
</svg>
