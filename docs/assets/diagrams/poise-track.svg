<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Poise is a mirrored track with a floor</title>
<desc>Poise is a row of boxes, 5 plus your Presence. At 0 you are Flustered. The row runs the same distance again below zero, where you are Humiliated, and reaching the far end resets Poise to 0 and costs a Sanity Level. Poise has no death threshold.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<text x="60" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">Humiliated</text>
<text x="60" y="71" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">below zero</text>
<line x1="105" y1="55" x2="152" y2="55" stroke="#5c7d92" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="160" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="242" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="324" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="406" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="488" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>

<line x1="160" y1="95" x2="160" y2="105" stroke="#5c7d92" stroke-width="1"/>
<text x="160" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">0</text>
<text x="160" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">Flustered</text>

<text x="523" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">5 + Presence</text>
<text x="523" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">full Poise</text>

<text x="60" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#f0a89c">&#8722;(full Poise)</text>
<text x="60" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">resets to 0,</text>
<text x="60" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">costs a Sanity</text>
</svg>
