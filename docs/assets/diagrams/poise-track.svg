<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Poise is a row of boxes that stops at 0</title>
<desc>Poise mirrors Health Levels but cannot drop below 0. Once at 0, a character is Flustered - further connecting Social dice have no additional effect.</desc>

<line x1="152" y1="15" x2="152" y2="95" stroke="#eaf5fb" stroke-width="2.5"/>

<rect x="180" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="262" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="344" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="426" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="508" y="20" width="70" height="70" rx="6" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>

<line x1="180" y1="95" x2="180" y2="105" stroke="#5c7d92" stroke-width="1"/>
<text x="180" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">0</text>
<text x="180" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#e0685c">Flustered</text>

<text x="75" y="55" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">can't go</text>
<text x="75" y="71" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">lower</text>

<text x="543" y="120" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#eaf5fb">5 + Presence</text>
<text x="543" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">full Poise</text>
</svg>
