<svg width="680" height="140" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The four Range Bands</title>
<desc>Distance is tracked in four loose bands: Melee, Close, Near, and Far. Spending a full Movement Rate shifts one band.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="30" y="30" width="140" height="70" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="100" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Melee</text>

<line x1="170" y1="65" x2="188" y2="65" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="30" width="140" height="70" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="260" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Close</text>

<line x1="330" y1="65" x2="348" y2="65" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="350" y="30" width="140" height="70" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="420" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Near</text>

<line x1="490" y1="65" x2="508" y2="65" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="510" y="30" width="140" height="70" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="580" y="65" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Far</text>

<text x="340" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">spending a full Movement Rate shifts one band</text>
</svg>
