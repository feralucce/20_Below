<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Fast, Normal, and Slow Action Brackets compared</title>
<desc>Fast gives one action and acts first. Normal gives two actions and acts second. Slow gives one empowered action - allowing called shots and Advantage - and acts last.</desc>

<rect x="20" y="30" width="200" height="160" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="120" y="58" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#eaf5fb">Fast</text>
<text x="120" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8fadbe">1 action</text>
<text x="120" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#6fb2e0">acts 1st</text>
<text x="120" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">speed over</text>
<text x="120" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">everything</text>

<rect x="240" y="30" width="200" height="160" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#eaf5fb">Normal</text>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8fadbe">2 actions</text>
<text x="340" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#6fb2e0">acts 2nd</text>
<text x="340" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">the balanced</text>
<text x="340" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">middle</text>

<rect x="460" y="30" width="200" height="160" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="560" y="58" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#eaf5fb">Slow</text>
<text x="560" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8fadbe">1 empowered action</text>
<text x="560" y="110" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#6fb2e0">acts 3rd</text>
<text x="560" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">called shots,</text>
<text x="560" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">Advantage</text>
</svg>
