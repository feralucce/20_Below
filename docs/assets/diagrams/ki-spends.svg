<svg width="680" height="260" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>What Ki is spent on</title>
<desc>Ki, your strongest Element plus 8, is spent four ways: to preserve a Health or Sanity Level, to bump an Action Bracket up a step, to boost an attack die via Ki Infusion, and to use most Gifts. All four are direct spends with no roll.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="270" y="16" width="140" height="58" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="16" font-weight="700" fill="#eaf5fb">Ki</text>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">strongest Element + 8</text>

<line x1="340" y1="74" x2="85" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="74" x2="255" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="74" x2="425" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="74" x2="595" y2="132" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="10" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="85" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Preserve a Level</text>
<text x="85" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">Health or Sanity</text>

<rect x="180" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="255" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Bump a Bracket</text>
<text x="255" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">1 Ki per step</text>

<rect x="350" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="425" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Boost a Die</text>
<text x="425" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">Ki Infusion</text>

<rect x="520" y="134" width="150" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="595" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">Use a Gift</text>
<text x="595" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">cost per Gift and Level</text>

<text x="340" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">all four are direct spends - some Gifts also call for a Gift Check against current Ki</text>
</svg>
