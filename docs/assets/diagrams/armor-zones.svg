<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Armor covers a Body Zone or a Head Zone</title>
<desc>Normal attacks resolve against Body-Zone armor. Only a called shot, legal as a Slow Action Bracket, can target Head-Zone armor instead. Each Zone's armor has its own Hardness and Health Levels.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="240" y="20" width="200" height="70" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Head Zone</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">e.g. helmet: Hardness 4, 2 HL</text>

<line x1="60" y1="55" x2="238" y2="55" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="42" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">called shot only</text>
<text x="150" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c7d92">(Slow action)</text>

<rect x="240" y="140" width="200" height="70" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Body Zone</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">e.g. vest: Hardness 5, 3 HL</text>

<line x1="620" y1="175" x2="442" y2="175" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="530" y="162" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">every normal attack</text>
</svg>
