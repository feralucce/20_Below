<svg width="680" height="344" viewBox="0 0 680 344" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Armor covers four Zones: Center of Mass, Head, Arms and Legs</title>
<desc>Normal attacks resolve against Center of Mass armor. Only a called shot, legal as a Slow Action Bracket, can target the Head, Arms or Legs instead. Each piece of armor has its own Hardness and Health Levels, and one item can cover several Zones.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="310" y="20" width="200" height="60" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="410.0" y="41.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Head Zone</text>
<text x="410.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">e.g. helmet: Hardness 4, 2 HL</text>
<rect x="116" y="130" width="184" height="60" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="208.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Arms Zone</text>
<text x="208.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">e.g. gauntlets: Hardness 2, 1 HL</text>
<rect x="310" y="120" width="200" height="80" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="410.0" y="151.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Center of Mass</text>
<text x="410.0" y="172.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">e.g. vest: Hardness 5, 3 HL</text>
<rect x="310" y="240" width="200" height="60" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="410.0" y="261.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="600" fill="#eaf5fb">Legs Zone</text>
<text x="410.0" y="282.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">e.g. greaves: Hardness 2, 1 HL</text>
<line x1="40" y1="50" x2="308" y2="50" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="170" y="40" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">called shot only</text>
<text x="170" y="66" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c7d92">(Slow action)</text>
<line x1="8" y1="160" x2="114" y2="160" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="60" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">called shot only</text>
<text x="60" y="176" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#5c7d92">(Slow action)</text>
<line x1="40" y1="270" x2="308" y2="270" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="170" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">called shot only</text>
<text x="170" y="286" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c7d92">(Slow action)</text>
<line x1="660" y1="160" x2="512" y2="160" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="586" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">every normal attack</text>
<text x="340" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c7d92">One item can cover several Zones: plate armor covers Center of Mass, Arms and Legs.</text>
</svg>
