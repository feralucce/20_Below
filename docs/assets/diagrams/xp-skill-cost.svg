<svg width="680" height="220" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Skill Tier raise cost climbs with current tier</title>
<desc>Raising a Skill Tier costs the current tier times 2 XP - free from Untrained to Novice, up to 8 XP from Expert to Master.</desc>
<rect x="30" y="167.0" width="100" height="3.0" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="150" y="137.5" width="100" height="32.5" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="270" y="105.0" width="100" height="65.0" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="390" y="72.5" width="100" height="97.5" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<rect x="510" y="40.0" width="100" height="130.0" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1.5"/>
<text x="80.0" y="159.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#eaf5fb">0 XP</text>
<text x="80.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="10.5"  fill="#8fadbe">Untrained→Novice</text>
<text x="200.0" y="129.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#eaf5fb">2 XP</text>
<text x="200.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="10.5"  fill="#8fadbe">Novice→Trained</text>
<text x="320.0" y="97.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#eaf5fb">4 XP</text>
<text x="320.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="10.5"  fill="#8fadbe">Trained→Adept</text>
<text x="440.0" y="64.5" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#eaf5fb">6 XP</text>
<text x="440.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="10.5"  fill="#8fadbe">Adept→Expert</text>
<text x="560.0" y="32.0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#eaf5fb">8 XP</text>
<text x="560.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="10.5"  fill="#8fadbe">Expert→Master</text>
</svg>
