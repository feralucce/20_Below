<text x="138.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#8fadbe">#2</text>
<text x="216.0" y="140.3" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eaf5fb">1 XP</text>
<text x="216.0" y="190.0" text-anchor="middle" font-family="sans-serif" font-size="12"  fill="#8fadbe">#3</text>
<text x="294.0" y="75.3" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#eaf5fb">4 XP</text>
