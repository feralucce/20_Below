<rect x="342" y="61.7" width="60" height="108.3" rx="4" fill="#3a2e14" stroke="#e0a85c" stroke-width="1.5"/>
<rect x="420" y="40.0" width="60" height="130.0" rx="4" fill="#3a2e14" stroke="#e0a85c" stroke-width="1.5"/>
