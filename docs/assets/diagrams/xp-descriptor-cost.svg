<svg width="560" height="220" viewBox="0 0 560 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Extra Descriptor cost stays flat for the first 3, then climbs</title>
<desc>The first 3 extra Descriptors on a sub-stat cost a flat 1 XP each. Past that, cost equals the current Descriptor count times 1 XP.</desc>
