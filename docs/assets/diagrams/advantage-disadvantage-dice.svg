<svg width="680" height="200" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Advantage keeps the lowest two dice, Disadvantage keeps the highest two</title>
<desc>Both roll 3d10. Advantage keeps the lowest two results and discards the highest. Disadvantage keeps the highest two results and discards the lowest. Since 20 Below is roll-under, keeping low dice helps and keeping high dice hurts.</desc>

<text x="175" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#eaf5fb">Advantage</text>

<rect x="65" y="45" width="60" height="60" rx="8" fill="#1c2733" stroke="#3a4552" stroke-width="1"/>
<text x="95" y="79" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" fill="#5c7d92">9</text>

<rect x="145" y="45" width="60" height="60" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="175" y="79" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#eaf5fb">6</text>

<rect x="225" y="45" width="60" height="60" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="255" y="79" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#eaf5fb">3</text>

<text x="175" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6fb2e0">kept: 3 + 6 = 9</text>
<text x="175" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c7d92">9 discarded</text>

<text x="505" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#eaf5fb">Disadvantage</text>

<rect x="395" y="45" width="60" height="60" rx="8" fill="#1c2733" stroke="#3a4552" stroke-width="1"/>
<text x="425" y="79" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" fill="#5c7d92">3</text>

<rect x="475" y="45" width="60" height="60" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="505" y="79" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#eaf5fb">6</text>

<rect x="555" y="45" width="60" height="60" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="585" y="79" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="20" font-weight="700" fill="#eaf5fb">9</text>

<text x="505" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6fb2e0">kept: 6 + 9 = 15</text>
<text x="505" y="146" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5c7d92">3 discarded</text>

<line x1="340" y1="20" x2="340" y2="160" stroke="#24404f" stroke-width="1"/>

<text x="175" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">lower total = easier</text>
<text x="505" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">higher total = harder</text>
</svg>
