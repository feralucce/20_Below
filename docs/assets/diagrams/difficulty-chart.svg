<svg width="790" height="414" viewBox="0 0 790 414" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Difficulty Chart</title>
<desc>An 11-step reference ladder for setting Difficulty, 0 nearly impossible through 10 trivial, color-banded red to blue with example tasks.</desc>
<rect x="0" y="0" width="790" height="40" fill="#2b2b2b"/>
<text x="12" y="20" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Difficulty</text>
<text x="122" y="20" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Label</text>
<text x="302" y="20" dominant-baseline="central" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Example task</text>
<rect x="0" y="40" width="790" height="34" fill="#e57373"/>
<text x="12" y="57" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">0</text>
<text x="122" y="57" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Nearly Impossible</text>
<text x="302" y="57" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Catch an arrow out of the air mid-flight</text>
<rect x="0" y="74" width="790" height="34" fill="#e57373"/>
<text x="12" y="91" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">1</text>
<text x="122" y="91" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Extremely Hard</text>
<text x="302" y="91" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Pick a masterwork lock with no tools, blindfolded</text>
<rect x="0" y="108" width="790" height="34" fill="#ffb74d"/>
<text x="12" y="125" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">2</text>
<text x="122" y="125" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Very Hard</text>
<text x="302" y="125" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Scale a sheer, rain-slicked cliff face</text>
<rect x="0" y="142" width="790" height="34" fill="#ffb74d"/>
<text x="12" y="159" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">3</text>
<text x="122" y="159" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Hard</text>
<text x="302" y="159" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Convince a hostile guard captain to stand down</text>
<rect x="0" y="176" width="790" height="34" fill="#fff176"/>
<text x="12" y="193" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">4</text>
<text x="122" y="193" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Challenging</text>
<text x="302" y="193" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Track a careful quarry through a rainstorm</text>
<rect x="0" y="210" width="790" height="34" fill="#fff176"/>
<text x="12" y="227" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">5</text>
<text x="122" y="227" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Moderate</text>
<text x="302" y="227" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">A tense but ordinary skill check under pressure</text>
<rect x="0" y="244" width="790" height="34" fill="#fff176"/>
<text x="12" y="261" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">6</text>
<text x="122" y="261" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Fairly Easy</text>
<text x="302" y="261" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Pick a simple lock with the right tools</text>
<rect x="0" y="278" width="790" height="34" fill="#aed581"/>
<text x="12" y="295" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">7</text>
<text x="122" y="295" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Easy</text>
<text x="302" y="295" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Climb a sturdy rope with knots tied in it</text>
<rect x="0" y="312" width="790" height="34" fill="#aed581"/>
<text x="12" y="329" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">8</text>
<text x="122" y="329" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Very Easy</text>
<text x="302" y="329" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Recall a well-known fact in your field</text>
<rect x="0" y="346" width="790" height="34" fill="#64b5f6"/>
<text x="12" y="363" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">9</text>
<text x="122" y="363" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Nearly Trivial</text>
<text x="302" y="363" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Walk a straight line on level ground</text>
<rect x="0" y="380" width="790" height="34" fill="#64b5f6"/>
<text x="12" y="397" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">10</text>
<text x="122" y="397" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Trivial</text>
<text x="302" y="397" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#000000">Tie your own shoes</text>
<line x1="110" y1="0" x2="110" y2="414" stroke="#ffffff" stroke-width="1.5"/>
<line x1="290" y1="0" x2="290" y2="414" stroke="#ffffff" stroke-width="1.5"/>
</svg>
