<svg width="500" height="220" viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Limiter buy-off cost scales with the Gift's current level</title>
<desc>Buying off one Limiter costs 3 times the Gift's current level in XP - 3 XP at Level 1 up to 15 XP at Level 5, per Limiter removed.</desc>
