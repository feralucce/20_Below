<svg width="680" height="726" viewBox="0 0 680 726" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Combat overview flow</title>
<desc>Initiative is rolled once at the start of the fight and holds for its entire duration. Then, each round: declare an Action Bracket, act in bracket order, roll to hit (Attribute vs. Defense). A miss ends the attack. A hit rolls damage dice, each resolved individually against the defender's wall stat - a die at or below the wall is absorbed, a die above it connects and costs a Level.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="220" y="20" width="240" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Initiative</text>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">rolled once, holds for the whole fight</text>

<line x1="340" y1="76" x2="340" y2="106" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="108" width="240" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Declare Action Bracket</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">Fast / Normal / Slow</text>

<line x1="340" y1="164" x2="340" y2="194" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="196" width="240" height="46" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="219" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Act in Bracket Order</text>

<line x1="340" y1="242" x2="340" y2="272" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="274" width="280" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="296" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Roll to Hit</text>
<text x="340" y="314" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">Attacker's Attribute vs. Defender's Defense</text>

<line x1="270" y1="330" x2="170" y2="366" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="410" y1="330" x2="510" y2="366" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="368" width="260" height="50" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="170" y="387" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Miss</text>
<text x="170" y="404" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">nothing happens</text>

<rect x="380" y="368" width="260" height="50" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="510" y="387" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Hit</text>
<text x="510" y="404" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">roll damage dice</text>

<line x1="510" y1="418" x2="510" y2="448" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="360" y="450" width="300" height="74" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="510" y="472" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Resolve Each Die</text>
<text x="510" y="490" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">vs. the defender's wall</text>
<text x="510" y="506" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">(Soak / Presence / Psyche)</text>

<line x1="450" y1="524" x2="290" y2="560" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570" y1="524" x2="620" y2="560" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="562" width="260" height="56" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="190" y="584" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Die &#8804; Wall</text>
<text x="190" y="602" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">absorbed, no effect</text>

<rect x="400" y="562" width="260" height="56" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="530" y="584" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Die &gt; Wall</text>
<text x="530" y="602" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">connects</text>

<line x1="530" y1="618" x2="530" y2="648" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="390" y="650" width="280" height="56" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="530" y="672" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Health / Poise / Sanity</text>
<text x="530" y="690" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">loses one Level, whichever fits the attack</text>
</svg>
