<svg width="680" height="270" viewBox="0 0 680 270" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Distracted resolves with a single roll</title>
<desc>Losing a Health Level or being targeted by Kotodama while resolving a Slow action triggers a roll to hold focus. Success resolves the action as declared. Failure downgrades a Slow action to Normal, or imposes Disadvantage outside a Slow action.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="190" y="20" width="300" height="50" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="45" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Hit while resolving Slow, or Kotodama target</text>

<line x1="340" y1="70" x2="340" y2="100" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="100" width="240" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340" y="122" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Roll to Hold Focus</text>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">Atropos + Difficulty</text>

<line x1="290" y1="156" x2="210" y2="192" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="390" y1="156" x2="470" y2="192" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="100" y="194" width="220" height="56" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="210" y="216" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Success</text>
<text x="210" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fd4a0">acts exactly as declared</text>

<rect x="360" y="194" width="220" height="56" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="470" y="216" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Failure</text>
<text x="470" y="234" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#f0a89c">Slow &#8594; Normal, or Disadvantage</text>

<text x="340" y="264" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">Concentration grants immunity, regardless of source</text>
</svg>
