<svg width="680" height="230" viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Spending a Fate Token</title>
<desc>Spending a Fate Token buys its effect directly, with no follow-up roll. Both limits come from Stamina: you can hold Stamina times three, and spend Stamina of them in a single Scene.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/>
</marker>
</defs>

<rect x="40" y="26" width="200" height="58" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="140" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Spend a Fate Token</text>
<text x="140" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">the token is the whole cost</text>

<line x1="240" y1="55" x2="316" y2="55" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="324" y="26" width="220" height="58" rx="8" fill="#16281c" stroke="#6fbf73" stroke-width="1"/>
<text x="434" y="48" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">The effect happens</text>
<text x="434" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fd4a0">no roll, nothing else at risk</text>

<text x="340" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">two limits, both from Stamina</text>

<rect x="70" y="142" width="230" height="58" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="185" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#eaf5fb">Stamina &#215; 3</text>
<text x="185" y="184" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">how many you can hold at once</text>

<rect x="380" y="142" width="230" height="58" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="495" y="164" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#eaf5fb">Stamina</text>
<text x="495" y="184" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#8fadbe">how many you can spend in a Scene</text>
</svg>
