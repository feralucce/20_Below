<svg width="680" height="140" viewBox="0 0 680 140" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The four attacking elements</title>
<desc>Earth is Force, Air is Precision, Fire is Intensity, Water is Adaptation. Moira is never an attacking element - only Earth, Air, Fire, or Water can be chosen for the to-hit roll, based on the attacker's approach.</desc>

<rect x="10" y="20" width="150" height="90" rx="8" fill="#2e2717" stroke="#c9a86b" stroke-width="1"/>
<text x="85" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#c9a86b">Earth</text>
<text x="85" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">Force</text>

<rect x="180" y="20" width="150" height="90" rx="8" fill="#16283a" stroke="#6fb8e0" stroke-width="1"/>
<text x="255" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#6fb8e0">Air</text>
<text x="255" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">Precision</text>

<rect x="350" y="20" width="150" height="90" rx="8" fill="#2e1a17" stroke="#e0685c" stroke-width="1"/>
<text x="425" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#e0685c">Fire</text>
<text x="425" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">Intensity</text>

<rect x="520" y="20" width="150" height="90" rx="8" fill="#16281f" stroke="#5cc9b0" stroke-width="1"/>
<text x="595" y="52" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#5cc9b0">Water</text>
<text x="595" y="78" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">Adaptation</text>
</svg>
