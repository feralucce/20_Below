<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Resource Index inverts like Defense</title>
<desc>A lower Resource Index adds more to your target number, making the check easier. Resource Index 1 adds 9, Resource Index 6 adds only 4 - the minimum any Resource Check can add.</desc>

<text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8fadbe">amount added to your target number, by Resource Index</text>

<line x1="30" y1="250" x2="650" y2="250" stroke="#5c7d92" stroke-width="1"/>

<rect x="40" y="70" width="70" height="180" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="75" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">+9</text>
<text x="75" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">RI 1</text>

<rect x="140" y="90" width="70" height="160" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="175" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">+8</text>
<text x="175" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">RI 2</text>

<rect x="240" y="110" width="70" height="140" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="275" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">+7</text>
<text x="275" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">RI 3</text>

<rect x="340" y="130" width="70" height="120" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="375" y="120" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">+6</text>
<text x="375" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">RI 4</text>

<rect x="440" y="150" width="70" height="100" rx="4" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="475" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">+5</text>
<text x="475" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">RI 5</text>

<rect x="540" y="170" width="70" height="80" rx="4" fill="#1c3548" stroke="#3d84c4" stroke-width="1"/>
<text x="575" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#6fb2e0">+4</text>
<text x="575" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">RI 6</text>

<text x="575" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6fb2e0">reaching beyond your means</text>
</svg>
