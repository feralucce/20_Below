<svg width="680" height="468" viewBox="0 0 680 468" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Chance the venom leaves you unconscious (Exhausted 5)</title>
<desc>In the first draft Frankie ended unconscious 56 percent of the time and Annie 7. If Envenomed's Disadvantage had applied to the resist roll, that would have risen to 80 and 21, so it was rejected. Under the final rule, where the resist roll is never at Disadvantage, it is 40 and 1.6, and with daily Medicine it falls to 6 and 0. Tony stays under 3 percent and Maggie at 0 throughout.</desc>
<text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Chance the venom leaves you unconscious (Exhausted 5)</text>
<rect x="10" y="36" width="11" height="11" rx="2" fill="#8fadbe"/>
<text x="26" y="46" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">First draft</text>
<rect x="113" y="36" width="11" height="11" rx="2" fill="#d1584f"/>
<text x="129" y="46" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">Rejected: Envenomed applies</text>
<rect x="328" y="36" width="11" height="11" rx="2" fill="#3d84c4"/>
<text x="344" y="46" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">Final rule</text>
<rect x="424" y="36" width="11" height="11" rx="2" fill="#4caf7d"/>
<text x="440" y="46" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">Final rule + Medicine</text>
<line x1="150.0" y1="58" x2="150.0" y2="430" stroke="#24404f" stroke-width="1"/>
