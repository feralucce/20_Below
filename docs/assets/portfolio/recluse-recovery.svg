<text x="355.0" y="446" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">50%</text>
<line x1="457.5" y1="58" x2="457.5" y2="430" stroke="#24404f" stroke-width="1"/>
<text x="457.5" y="446" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">75%</text>
