<rect x="150" y="82" width="410.0" height="14" rx="3" fill="#8fadbe"/>
<text x="566.0" y="93" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">100%  unconscious</text>
<text x="138" y="140.0" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#eaf5fb">Average Annie</text>
<rect x="150" y="118" width="159.9" height="14" rx="3" fill="#3d84c4"/>
<text x="315.9" y="129" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">39%</text>
<rect x="150" y="136" width="262.4" height="14" rx="3" fill="#8fadbe"/>
<text x="418.4" y="147" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">64%</text>
