<rect x="150" y="190" width="135.3" height="14" rx="3" fill="#8fadbe"/>
<text x="291.3" y="201" text-anchor="start" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">33%</text>
<text x="138" y="248.0" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#eaf5fb">Maxed Maggie</text>
