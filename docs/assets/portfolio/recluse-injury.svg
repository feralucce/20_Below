<svg width="680" height="324" viewBox="0 0 680 324" xmlns="http://www.w3.org/2000/svg" role="img">
<title>One Giant recluse bite: share of Health lost</title>
<desc>With 1, 2 and 3 dice by size, a Giant bite takes 60 percent of Frankie's Health, 39 percent of Annie's, 20 percent of Tony's and 6 percent of Maggie's. With 1, 3 and 5 dice it takes all of Frankie's Health, knocking Frankie out, 64 percent of Annie's, 33 percent of Tony's and 10 percent of Maggie's. The team chose 1, 2 and 3.</desc>
<text x="10" y="22" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">One Giant recluse bite: share of Health lost</text>
<rect x="10" y="36" width="11" height="11" rx="2" fill="#3d84c4"/>
<text x="26" y="46" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">1 / 2 / 3 dice (chosen)</text>
<rect x="197" y="36" width="11" height="11" rx="2" fill="#8fadbe"/>
<text x="213" y="46" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">1 / 3 / 5 dice</text>
<line x1="150.0" y1="58" x2="150.0" y2="286" stroke="#24404f" stroke-width="1"/>
<text x="150.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">0%</text>
<line x1="252.5" y1="58" x2="252.5" y2="286" stroke="#24404f" stroke-width="1"/>
<text x="252.5" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">25%</text>
<line x1="355.0" y1="58" x2="355.0" y2="286" stroke="#24404f" stroke-width="1"/>
<text x="355.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">50%</text>
<line x1="457.5" y1="58" x2="457.5" y2="286" stroke="#24404f" stroke-width="1"/>
<text x="457.5" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">75%</text>
<line x1="560.0" y1="58" x2="560.0" y2="286" stroke="#24404f" stroke-width="1"/>
<text x="560.0" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8fadbe">100%</text>
<text x="138" y="86.0" text-anchor="end" font-family="sans-serif" font-size="12.5" fill="#eaf5fb">Fragile Frankie</text>
<rect x="150" y="64" width="246.0" height="14" rx="3" fill="#3d84c4"/>
