<text x="427.72222222222223" y="128" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">5 (one per page)</text>
<line x1="24" y1="166" x2="876" y2="166" stroke="#24404f" stroke-width="1"/>
<text x="24" y="192" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">Actions for one attack</text>
<text x="24" y="212" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">fewer is better: clicks and choices</text>
