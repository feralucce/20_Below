<text x="798.0" y="194" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">5</text>
<text x="712.0" y="214" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">4</text>
<line x1="24" y1="252" x2="876" y2="252" stroke="#24404f" stroke-width="1"/>
<text x="24" y="278" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">When Advantage or Disadvantage applies</text>
<text x="24" y="298" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">fewer is better: the old window needed a box ticked</text>
<g><title>When Advantage or Disadvantage applies, before: 6</title><path d="M360 266 H786.0 Q790.0 266 790.0 270 V280 Q790.0 284 786.0 284 H360 Z" fill="#d95926"/></g>
<g><title>When Advantage or Disadvantage applies, after: 4</title><path d="M360 286 H642.6666666666667 Q646.6666666666667 286 646.6666666666667 290 V300 Q646.6666666666667 304 642.6666666666667 304 H360 Z" fill="#3987e5"/></g>
<text x="798.0" y="280" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">6</text>
<text x="654.6666666666667" y="300" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">4</text>
