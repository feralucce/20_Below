<text x="24" y="364" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">Dice rolls</text>
<text x="24" y="384" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">fewer is better: to hit, then damage, became one</text>
