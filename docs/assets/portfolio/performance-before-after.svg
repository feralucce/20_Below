<g><title>Dice rolls, after: 1</title><path d="M360 372 H571.0 Q575.0 372 575.0 376 V386 Q575.0 390 571.0 390 H360 Z" fill="#3987e5"/></g>
<text x="798.0" y="366" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">2</text>
<text x="583.0" y="386" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">1</text>
<line x1="24" y1="424" x2="876" y2="424" stroke="#24404f" stroke-width="1"/>
<text x="24" y="450" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#eaf5fb">Outcomes one roll answers</text>
<text x="24" y="470" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">more is better: Normal, Advantage and Disadvantage</text>
<g><title>Outcomes one roll answers, before: 1</title><path d="M360 438 H499.33333333333337 Q503.33333333333337 438 503.33333333333337 442 V452 Q503.33333333333337 456 499.33333333333337 456 H360 Z" fill="#d95926"/></g>
<g><title>Outcomes one roll answers, after: 3</title><path d="M360 458 H786.0 Q790.0 458 790.0 462 V472 Q790.0 476 786.0 476 H360 Z" fill="#3987e5"/></g>
<text x="511.33333333333337" y="452" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">1</text>
<text x="798.0" y="472" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#eaf5fb">3</text>
<text x="24" y="526" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5c7686">Measured by driving the same attack through both versions of the Character Creator: the Viktor Grave sample fires his</text>
<text x="24" y="543" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5c7686">Compact pistol (3 dice) through Air at Defense 5 and Soak 3. Fields already set right by default are not counted.</text>
<text x="24" y="560" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#5c7686">Each row has its own scale.</text>
</svg>