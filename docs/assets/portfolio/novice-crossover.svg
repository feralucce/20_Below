<text x="10.0" y="47.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#8fadbe">Chance to succeed on any Skill roll at Difficulty 7, by the Attribute behind it</text>

<text x="10.0" y="65.0" text-anchor="start" font-family="sans-serif" font-size="12.5" fill="#8fadbe">Untrained ignores the Attribute. Novice added it but rolled at Disadvantage.</text>

