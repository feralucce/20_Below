<svg width="860" height="500" viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A Novice rolled worse than someone Untrained at Attributes 1 and 2</title>
<desc>Chance to succeed on a Skill roll at Difficulty 7, by Attribute 1 to 10. Untrained is flat at 21% because the Attribute does not apply. Novice, with Disadvantage, is 11% at Attribute 1 and 15% at Attribute 2, below Untrained, and crosses it at Attribute 3. Trained is 28% at Attribute 1.</desc>
