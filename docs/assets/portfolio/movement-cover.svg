<svg width="960" height="380" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cover: a gunman's chance to hit you</title>
<desc>A gunman (Attack 5) shooting at each test character. In the open: Frankie 79%, Mike 72%, Annie 64%, Tony 64%, Maggie 72%. Behind partial cover: Frankie 57%, Mike 47%, Annie 38%, Tony 38%, Maggie 47%. Belly Down behind partial cover counts two Disadvantages, so even an Aimed shot stays at Disadvantage.</desc>
