<text x="10.0" y="24.0" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="500" fill="#eaf5fb">Cover: a gunman's chance to hit you</text>
<text x="10.0" y="43.0" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">His Attack 5 + your Defense. Sources count: partial cover -1, Belly Down -1 (ranged), Aim +1. Full cover: he can't shoot at all.</text>
