<svg width="680" height="710" viewBox="0 0 680 710" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Weapons and armor</title>
<desc>A weapon's Damage rating is its number of d10, 1 to 5 for ordinary weapons and higher for special weapons, and never grows. Within Normal range there is no penalty, out to Long range the attack has Disadvantage, beyond Long it cannot be made. On a hit every die goes to the Zone the attack aims at: Center of Mass armor for every normal attack; Head, Arms or Legs armor only for a called shot as a Slow action. If that armor still has Health Levels, each die meets its Hardness: at or under is deflected, over is stopped but costs the armor a Level, at most one per attack, and Ki can't preserve armor. With no working armor, each die meets the wearer's Soak, and any over it costs a Health Level.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c7d92"/></marker></defs>
<rect x="200" y="20" width="280" height="56" rx="8" fill="#2b4a5e" stroke="#5f89a3" stroke-width="1"/>
<text x="340.0" y="39.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Weapon</text>
<text x="340.0" y="57.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8fadbe">Damage rating = number of d10</text>
<text x="340" y="96" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">fists 1 • knife 3 • hunting rifle 4 • chainsaw 5 • special weapons 5+ • never grows</text>
<line x1="340" y1="104" x2="340" y2="128" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
