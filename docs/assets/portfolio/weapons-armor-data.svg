<line x1="560" y1="190" x2="560" y2="210" stroke="#5c7d92" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="212" width="200" height="50" rx="8" fill="#1f3a2c" stroke="#4caf7d" stroke-width="1"/>
<text x="120.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Within Normal</text>
<text x="120.0" y="246.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#9fd4b5">no penalty</text>
<rect x="240" y="212" width="200" height="50" rx="8" fill="#3a3020" stroke="#c9954a" stroke-width="1"/>
<text x="340.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Out to Long</text>
<text x="340.0" y="246.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#e2c08c">Disadvantage on the attack</text>
<rect x="460" y="212" width="200" height="50" rx="8" fill="#3a2226" stroke="#d1584f" stroke-width="1"/>
<text x="560.0" y="228.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#eaf5fb">Beyond Long</text>
<text x="560.0" y="246.0" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#e39a92">can't be attacked</text>
<text x="340" y="284" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">on a hit, every die goes to the Zone the attack aims at:</text>
