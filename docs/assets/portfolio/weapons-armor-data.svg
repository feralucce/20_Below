<text x="515" y="658" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">armor at 0 Levels stays broken until repaired</text>
<text x="340" y="692" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8fadbe">armor doesn't stack: one item per Zone • one item can cover several • Hardness uses the 0-10 Soak scale</text>
</svg>
