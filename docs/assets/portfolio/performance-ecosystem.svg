<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" width="1080" height="590">
<title>The 20 Below tool ecosystem: one set of rules code, three tools, and what travels between them</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5c7a8c"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4caf7d"/></marker></defs>
<rect width="1080" height="590" fill="#0a1720"/>
<rect x="390" y="24" width="300" height="58" rx="8" fill="#12232e" stroke="#24404f" stroke-width="1.5"/>
<text x="540.0" y="48.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#eaf5fb">The rulebook's rules</text>
<text x="540.0" y="70.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">rules/ - the one written source</text>
<line x1="540" y1="82" x2="540" y2="124" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="220" y="126" width="640" height="84" rx="8" fill="#2a2414" stroke="#d4af6a" stroke-width="1.5"/>
<text x="540.0" y="153.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#eaf5fb">One set of rules code</text>
<text x="540.0" y="175.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">the sheet model and the Roll dice window, written once</text>
<text x="540.0" y="194.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">Jack of all Trades, rests, Vital floors: every rule applied the same way</text>
<rect x="40" y="290" width="260" height="100" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="170.0" y="325.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#eaf5fb">Character Creator</text>
<text x="170.0" y="347.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">the player, building and advancing</text>
<text x="170.0" y="366.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">desktop and web</text>
<rect x="410" y="290" width="260" height="100" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="540.0" y="325.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#eaf5fb">Owlbear Character Sheet</text>
<text x="540.0" y="347.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">the player, at the table</text>
<text x="540.0" y="366.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">in Owlbear Rodeo</text>
<rect x="780" y="290" width="260" height="100" rx="8" fill="#1c3548" stroke="#3d84c4" stroke-width="1.5"/>
<text x="910.0" y="325.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#eaf5fb">Battle Tracker</text>
<text x="910.0" y="347.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">the GM, running the fight</text>
<text x="910.0" y="366.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">in Owlbear and on desktop</text>
<line x1="400" y1="210" x2="170" y2="288" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="540" y1="210" x2="540" y2="288" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="680" y1="210" x2="910" y2="288" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="552" y="254" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-style="italic" fill="#5c7686">the same code in all three</text>
<line x1="302" y1="340" x2="408" y2="340" stroke="#4caf7d" stroke-width="1.8" stroke-dasharray="6 5" marker-start="url(#g)" marker-end="url(#g)"/>
<text x="355" y="326" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#eaf5fb">character file</text>
<text x="355" y="362" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">via Downloads</text>
<line x1="672" y1="318" x2="778" y2="318" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="725" y="306" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#eaf5fb">Initiative</text>
<line x1="778" y1="362" x2="672" y2="362" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="725" y="382" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#eaf5fb">rests and</text>
<text x="725" y="398" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#eaf5fb">Fate Tokens</text>
<rect x="410" y="470" width="630" height="72" rx="8" fill="#12232e" stroke="#24404f" stroke-width="1.5"/>
<text x="725.0" y="501.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#eaf5fb">The Owlbear room</text>
<text x="725.0" y="523.0" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8fadbe">the roll log every player sees</text>
<line x1="540" y1="390" x2="540" y2="468" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="552" y="440" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#eaf5fb">rolls</text>
<line x1="910" y1="390" x2="910" y2="468" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="922" y="432" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#eaf5fb">public rolls</text>
<text x="922" y="448" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">(the GM's choice)</text>
<text x="40" y="474" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600" fill="#5c7686">KEY</text>
<line x1="40" y1="494" x2="84" y2="494" stroke="#5c7a8c" stroke-width="1.8" marker-end="url(#a)"/>
<text x="94" y="498" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">shared code, or a live message</text>
<line x1="40" y1="520" x2="84" y2="520" stroke="#4caf7d" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#g)"/>
<text x="94" y="524" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">a saved file</text>
<rect x="40" y="536" width="44" height="16" rx="4" fill="#2a2414" stroke="#d4af6a" stroke-width="1.5"/>
<text x="94" y="549" text-anchor="start" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8fadbe">written once, used everywhere</text>
</svg>