<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The exact odds of a 2d10 roll, with Advantage and Disadvantage</title>
<desc>Computed from every possible roll. Top: the chance of each total from 2 to 20. A normal 2d10 is a symmetric triangle peaking at 11. Advantage (3d10, keep the lowest two) and Disadvantage (3d10, keep the highest two) peak at 8 and 14, are narrower, and lean, with a long tail toward the middle; all three peak at exactly 10 percent. Means are 8.525, 11 and 13.475. Bottom: the chance to succeed at each target number, rolling equal to or under it. At a target of 11, Advantage succeeds 78.5 percent of the time, a normal roll 55 percent, Disadvantage 29 percent.</desc>
