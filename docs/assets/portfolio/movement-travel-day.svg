<text x="138.0" y="258.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">16</text>
<text x="246.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">Mike</text>
<text x="246.0" y="370.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6f8a99">Air 3, Stamina 2</text>
