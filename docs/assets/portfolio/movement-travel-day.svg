<text x="262.0" y="231.3" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">22</text>
<text x="370.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">Annie</text>
<text x="370.0" y="370.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6f8a99">Air 5, Stamina 3</text>
<g><title>Annie, 8-hour day: 32 km</title><rect x="339.0" y="186.4" width="30" height="153.6" rx="3" fill="#0a1720" stroke="#d95926" stroke-width="2"/></g>
<text x="354.0" y="181.4" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">32</text>
<g><title>Annie, 7-hour day: 28 km</title><rect x="371.0" y="205.6" width="30" height="134.4" rx="3" fill="#d95926"/></g>
<text x="386.0" y="200.6" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">28</text>
<text x="494.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">Tony</text>
<text x="494.0" y="370.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6f8a99">Air 7, Stamina 3</text>
<g><title>Tony, 8-hour day: 35 km</title><rect x="463.0" y="171.0" width="30" height="169.0" rx="3" fill="#0a1720" stroke="#199e70" stroke-width="2"/></g>
<text x="478.0" y="166.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">35</text>
<g><title>Tony, 7-hour day: 31 km</title><rect x="495.0" y="192.2" width="30" height="147.8" rx="3" fill="#199e70"/></g>
<text x="510.0" y="187.2" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">31</text>
<text x="618.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">Maggie</text>
<text x="618.0" y="370.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6f8a99">Air 10, Stamina 5</text>
<g><title>Maggie, 8-hour day: 40 km</title><rect x="587.0" y="148.0" width="30" height="192.0" rx="3" fill="#0a1720" stroke="#c98500" stroke-width="2"/></g>
<text x="602.0" y="143.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">40</text>
<g><title>Maggie, 9-hour day: 45 km</title><rect x="619.0" y="124.0" width="30" height="216.0" rx="3" fill="#c98500"/></g>
<text x="634.0" y="119.0" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">45</text>
