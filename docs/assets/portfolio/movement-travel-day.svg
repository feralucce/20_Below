<svg width="940" height="400" viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>A day's walk: fixed 8 hours vs 4 + Stamina hours</title>
<desc>Kilometers in a travel day at 3 + Air/5 km/h. Fixed 8-hour day: Frankie 26, Mike 29, Annie 32, Tony 35, Maggie 40. Day of 4 + Stamina hours: Frankie 16, Mike 22, Annie 28, Tony 31, Maggie 45. Real-world: beginner 12-18 km, fit hiker or army march 20-32, serious multi-day effort 40-45.</desc>
<rect width="940" height="400" fill="#0a1720"/>
<text x="10.0" y="24.0" text-anchor="start" font-family="sans-serif" font-size="15" font-weight="500" fill="#eaf5fb">A day's walk: fixed 8 hours vs 4 + Stamina hours</text>
<text x="10.0" y="43.0" text-anchor="start" font-family="sans-serif" font-size="12" fill="#8fadbe">Pace 3 + Air/5 km/h. Outline bar: 8-hour day. Solid bar: 4 + Stamina hours. Gray bands: real-world benchmarks.</text>
<rect x="60" y="253.6" width="620" height="28.8" fill="#8fadbe" fill-opacity="0.10"/>
<text x="688.0" y="272.0" text-anchor="start" font-family="sans-serif" font-size="10.5" fill="#8fadbe">Beginner hiker 12-18 km</text>
<rect x="60" y="186.4" width="620" height="57.6" fill="#8fadbe" fill-opacity="0.10"/>
<text x="688.0" y="219.2" text-anchor="start" font-family="sans-serif" font-size="10.5" fill="#8fadbe">Fit hiker or army march 20-32 km</text>
<rect x="60" y="124.0" width="620" height="24.0" fill="#8fadbe" fill-opacity="0.10"/>
<text x="688.0" y="140.0" text-anchor="start" font-family="sans-serif" font-size="10.5" fill="#8fadbe">Serious multi-day effort 40-45 km</text>
<line x1="60" y1="340.0" x2="680" y2="340.0" stroke="#24404f" stroke-width="1"/>
<text x="54.0" y="344.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8fadbe">0 km</text>
<line x1="60" y1="292.0" x2="680" y2="292.0" stroke="#24404f" stroke-width="1"/>
<text x="54.0" y="296.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8fadbe">10 km</text>
<line x1="60" y1="244.0" x2="680" y2="244.0" stroke="#24404f" stroke-width="1"/>
<text x="54.0" y="248.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8fadbe">20 km</text>
<line x1="60" y1="196.0" x2="680" y2="196.0" stroke="#24404f" stroke-width="1"/>
<text x="54.0" y="200.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8fadbe">30 km</text>
<line x1="60" y1="148.0" x2="680" y2="148.0" stroke="#24404f" stroke-width="1"/>
<text x="54.0" y="152.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8fadbe">40 km</text>
<line x1="60" y1="100.0" x2="680" y2="100.0" stroke="#24404f" stroke-width="1"/>
<text x="54.0" y="104.0" text-anchor="end" font-family="sans-serif" font-size="10.5" fill="#8fadbe">50 km</text>
<text x="122.0" y="356.0" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#eaf5fb">Frankie</text>
<text x="122.0" y="370.0" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#6f8a99">Air 1, Stamina 1</text>
<g><title>Frankie, 8-hour day: 26 km</title><rect x="91.0" y="217.1" width="30" height="122.9" rx="3" fill="#0a1720" stroke="#3987e5" stroke-width="2"/></g>
<text x="106.0" y="212.1" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#eaf5fb">26</text>
