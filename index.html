<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>20 Below</title>
<meta name="description" content="20 Below is a genre-agnostic, fated-heroes tabletop RPG. The core rules are free, forever - and so is Backwater Static, its first full setting." />
<link rel="icon" type="image/x-icon" href="docs/assets/brand/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="docs/assets/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="docs/assets/brand/favicon-128.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a1720;
    --panel: #12232e;
    --panel-alt: #0e1c26;
    --panel-border: #24404f;
    --text: #eaf5fb;
    --text-dim: #8fadbe;
    --accent: #3d84c4;
    --accent-dim: #1c3548;
    --bs-cyan: #3fe0c9;
    --bs-static: #ef5c93;
    --radius: 10px;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); }
  .display {
    font-family: "Fraunces", "Segoe UI", system-ui, serif;
  }

  /* ---- top nav ---- */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.85rem 1.5rem;
    background: rgba(10, 23, 32, 0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--panel-border);
  }
  .site-nav .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
    color: var(--text);
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .site-nav .brand img {
    height: 28px;
    width: auto;
    display: block;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 1.75rem;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .nav-links a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.3rem 0;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .nav-links a:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .nav-links .soon {
    color: var(--text-dim);
    font-size: 0.92rem;
    font-weight: 600;
    opacity: 0.5;
    cursor: default;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .nav-links .soon .pill {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border: 1px solid var(--panel-border);
    border-radius: 999px;
    padding: 0.1rem 0.45rem;
  }
  .nav-toggle {
    display: none;
    background: none;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    color: var(--text);
    width: 38px;
    height: 34px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  @media (max-width: 680px) {
    .nav-toggle { display: block; }
    .nav-links {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      padding: 0.5rem 1.5rem 1rem;
    }
    .nav-links.open { display: flex; }
    .nav-links li { width: 100%; padding: 0.6rem 0; border-bottom: 1px solid var(--panel-border); }
    .nav-links li:last-child { border-bottom: none; }
  }

  /* ==== Pinned fan sequence (desktop/tablet: JS-driven via GSAP) ==== */
  .pin-sequence {
    position: relative;
    height: 100vh;
    overflow: hidden;
    background: var(--bg) center/cover no-repeat;
    background-image: url('docs/assets/hero/pin-bg.webp');
  }
  .pin-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  .panel-inner {
    max-width: 560px;
    text-align: center;
  }

  /* hero-intro stage */
  .panel-inner .logo-mark-sm {
    max-width: 80px;
    height: auto;
    margin: 0 auto 1.1rem;
    display: block;
  }
  .hero-title {
    font-family: "Anton", "Segoe UI", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    font-size: clamp(2rem, 6.5vw, 3.4rem);
    letter-spacing: 0.01em;
    line-height: 1.05;
    margin: 0;
    color: var(--text);
  }
  .hero-title span { color: var(--accent); }
  .hero-subtitle {
    font-family: "Montserrat", "Segoe UI", sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.85rem;
    color: var(--text-dim);
    margin: 0.9rem 0 0;
  }

  /* fan stage - the 7 step cards accumulate here into a poker-hand fan.
     No position override here: it inherits position:absolute; inset:0
     from .pin-stage, which is what actually gives it its full-bleed
     size - a stray "position: relative" here previously collapsed it
     to zero height, since .pin-stage's rule and this one have equal
     specificity and this one came later. */
  .fan-card {
    position: absolute;
    left: 50%;
    bottom: 8%;
    width: clamp(170px, 24vw, 300px);
    height: auto;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 14px 30px rgba(0, 0, 0, 0.6));
    will-change: transform, opacity;
  }

  /* finale stage - closing tagline and the button onward. pointer-events:
     none by default since this stage sits on top of the other two the
     whole time (later in DOM order = painted on top, regardless of
     opacity) - without this the Continue button below would be
     clickable well before it's actually visible. JS flips it back to
     auto once the stage is actually revealed. */
  .finale-panel {
    pointer-events: none;
  }
  .closing-tagline {
    font-family: "Bebas Neue", sans-serif;
    letter-spacing: 0.04em;
    font-size: clamp(1.4rem, 4.5vw, 2.2rem);
    color: var(--accent);
    margin: 0;
  }
  .continue-btn {
    display: inline-block;
    margin-top: 2rem;
    padding: 0.7rem 1.8rem;
    border: 1px solid var(--accent);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-family: "Montserrat", "Segoe UI", sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    transition: background-color 0.15s ease, transform 0.15s ease;
  }
  .continue-btn:hover {
    background: var(--accent-dim);
    transform: translateY(-2px);
  }

  /* Mobile / no-JS / reduced-motion fallback: no pin. Hero and finale are
     a plain stacked block each (sized to their content, not forced to
     70vh - that left huge dead space around a couple of lines of text).
     The 7 cards become a horizontal swipe carousel instead of one long
     vertical stack, so getting through the intro is one screen's worth
     of swiping rather than several screens of scrolling. */
  .swipe-hint { display: none; }
  @media (max-width: 780px) {
    .pin-sequence { height: auto; overflow: visible; background-image: none; }
    .pin-stage {
      position: relative;
      inset: auto;
      padding: 3.5rem 1.5rem;
      border-top: 1px solid var(--panel-border);
    }
    .pin-stage:first-child { border-top: none; }
    .fan-stage {
      display: flex;
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
      overflow-anchor: none;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      gap: 0.75rem;
      padding: 1.5rem 2rem;
      scrollbar-width: none;
    }
    .fan-stage::-webkit-scrollbar { display: none; }
    .fan-card {
      position: relative;
      left: auto;
      bottom: auto;
      transform: none !important;
      flex: 0 0 auto;
      width: auto;
      height: 65vh;
      max-height: 65vh;
      scroll-snap-align: center;
    }
    .finale-panel { pointer-events: auto; }
    .swipe-hint {
      display: block;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.85rem;
      padding: 0 1.5rem 1rem;
    }
  }
  .no-js .pin-sequence,
  .reduced-motion .pin-sequence {
    height: auto;
    overflow: visible;
    background-image: none;
  }
  .no-js .pin-stage,
  .reduced-motion .pin-stage {
    position: relative;
    inset: auto;
    padding: 3.5rem 1.5rem;
    border-top: 1px solid var(--panel-border);
  }
  .no-js .pin-stage:first-child,
  .reduced-motion .pin-stage:first-child {
    border-top: none;
  }
  .no-js .fan-stage,
  .reduced-motion .fan-stage {
    display: flex;
    flex-direction: row;
    align-items: center;
    overflow-x: auto;
    overflow-anchor: none;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 0.75rem;
    padding: 1.5rem 2rem;
    scrollbar-width: none;
  }
  .no-js .fan-stage::-webkit-scrollbar,
  .reduced-motion .fan-stage::-webkit-scrollbar {
    display: none;
  }
  .no-js .fan-card,
  .reduced-motion .fan-card {
    position: relative;
    left: auto;
    bottom: auto;
    transform: none !important;
    flex: 0 0 auto;
    width: auto;
    height: 65vh;
    max-height: 65vh;
    scroll-snap-align: center;
    opacity: 1 !important;
  }
  .no-js .finale-panel,
  .reduced-motion .finale-panel {
    pointer-events: auto;
  }
  .no-js .swipe-hint,
  .reduced-motion .swipe-hint {
    display: block;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 0 1.5rem 1rem;
  }
</style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="home.html">
      <img src="docs/assets/brand/favicon-128.png" alt="" />
      20 BELOW
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false" id="navToggle">&#9776;</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="rules-hub.html">Rules &amp; Creator</a></li>
      <li><a href="https://feralucce.github.io/Backwater_Static/" target="_blank" rel="noopener">Backwater Static</a></li>
      <li><a href="license.html">ORC License</a></li>
      <li><span class="soon">Store <span class="pill">Soon</span></span></li>
      <li><a href="https://github.com/feralucce/20_Below" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </nav>

  <div class="pin-sequence" id="pinSequence">
    <div class="pin-stage hero-intro">
      <div class="panel-inner">
        <img class="logo-mark-sm" src="docs/assets/hero/logo-mark.png" alt="" />
        <h1 class="hero-title">HOW <span>20 BELOW</span> WORKS</h1>
        <p class="hero-subtitle">A Character-Driven RPG of Fate, the Gifted, and Worlds Below Our Own</p>
      </div>
    </div>

    <div class="pin-stage fan-stage" id="fanStage">
      <img class="fan-card" src="docs/assets/hero/card-1.webp" alt="Step 1: The World Presents a Problem. The GM sets the scene and describes the situation. Something stands in your way or calls you to action. Narrative First. The Story Drives Everything." />
      <img class="fan-card" src="docs/assets/hero/card-2.webp" alt="Step 2: Choose Your Approach. Decide how your hero will meet the challenge. Choose the element that best fits your approach. Five Elements. Countless Approaches." />
      <img class="fan-card" src="docs/assets/hero/card-3.webp" alt="Step 3: Calculate Your Target. The target number is calculated by adding your element and the difficulty set by the GM. Your Abilities Guide Your Fate." />
      <img class="fan-card" src="docs/assets/hero/card-4.webp" alt="Step 4: Roll 2d10. 2 is a critical success. 20 is a critical failure. Two Dice. Countless Outcomes." />
      <img class="fan-card" src="docs/assets/hero/card-5.webp" alt="Step 5: Compare Your Roll to Your Target Number. Roll 2d10; if the result is less than or equal to the target number it succeeds, otherwise it fails. 2 always succeeds. 20 always fails. Roll Under to Succeed." />
      <img class="fan-card" src="docs/assets/hero/card-6.webp" alt="Step 6: Determine the Outcome - Critical Success, Success, Failure, or Catastrophic Failure. The result tells you what happens and how the world changes. Every Roll Moves the Story Forward." />
      <img class="fan-card" src="docs/assets/hero/card-7.webp" alt="Step 7: The Story Continues. The GM describes the outcome. Face the consequences. Keep playing. Fate Answers When You Act." />
    </div>
    <p class="swipe-hint">Swipe for more &rarr;</p>

    <div class="pin-stage finale-panel">
      <div class="panel-inner">
        <p class="closing-tagline">Five Elements. Infinite Outcomes.<br />Your Story.</p>
        <a class="continue-btn" href="home.html">Continue &darr;</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('navToggle').addEventListener('click', function () {
      var links = document.getElementById('navLinks');
      var open = links.classList.toggle('open');
      this.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    // Belt-and-suspenders for the mobile card carousel: some mobile
    // browsers resolve the initial scroll-snap position using stale
    // geometry (seen landing mid-deck on real devices even with
    // overflow-anchor:none set), so force it back to card 1 explicitly.
    var fanStageEl = document.querySelector('.fan-stage');
    if (fanStageEl) {
      fanStageEl.scrollLeft = 0;
      window.addEventListener('load', function () {
        fanStageEl.scrollLeft = 0;
      });
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script>
    (function () {
      var initialized = false;

      function isNarrow() {
        return window.matchMedia('(max-width: 780px)').matches;
      }

      function initPinSequence() {
        if (initialized) return;
        var gsapLoaded = typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined';
        if (!gsapLoaded || isNarrow()) return;

        initialized = true;
        gsap.registerPlugin(ScrollTrigger);

        var hero = document.querySelector('.hero-intro');
        var fanStage = document.querySelector('.fan-stage');
        var finale = document.querySelector('.finale-panel');
        var cards = gsap.utils.toArray('.fan-card');

        // Resting slot for card index i (0-based) once it's been buried by
        // later cards. The most recently dealt card is always upright; each
        // card only tilts into the fan once the next one lands on top of it.
        var last = cards.length - 1;
        function restSlot(i) {
          var offset = i - last;
          return {
            rotate: offset * 7,
            x: offset * 38,
            y: -Math.abs(offset) * 8,
          };
        }

        gsap.set(finale, { opacity: 0 });
        cards.forEach(function (card, i) {
          var slot = restSlot(i);
          gsap.set(card, {
            xPercent: -50,
            zIndex: i + 1,
            rotate: 0,
            x: i === 0 ? slot.x : '100vw',
            y: slot.y,
            opacity: i === 0 ? 0 : 1,
            scale: i === 0 ? 0.85 : 1,
          });
        });

        // The fan sequence is standalone: it ends at the finale (logo +
        // tagline + Continue button) and stops there for real - there's
        // nothing after it in this document (Continue is a plain link to
        // home.html, a full page navigation), so scrolling further would
        // just reveal empty space. Lock it once reached; no need to ever
        // unlock, since clicking Continue navigates away entirely.
        var scrollLocked = false;
        var lockScrollY = 0;

        function holdAtEnd(self) {
          scrollLocked = true;
          lockScrollY = self.end;
          if (window.scrollY > lockScrollY) window.scrollTo(0, lockScrollY);
        }

        window.addEventListener(
          'wheel',
          function (e) {
            if (scrollLocked && e.deltaY > 0 && window.scrollY >= lockScrollY - 1) e.preventDefault();
          },
          { passive: false }
        );
        window.addEventListener(
          'touchmove',
          function (e) {
            if (scrollLocked && window.scrollY >= lockScrollY - 1) e.preventDefault();
          },
          { passive: false }
        );
        window.addEventListener('scroll', function () {
          if (scrollLocked && window.scrollY > lockScrollY) window.scrollTo(0, lockScrollY);
        });

        var steps = cards.length + 1; // 6 card-entrance beats + fan-exit/finale-reveal beat
        var tl = gsap.timeline({
          scrollTrigger: {
            trigger: '#pinSequence',
            start: 'top top',
            end: function () { return '+=' + window.innerHeight * steps; },
            pin: true,
            scrub: 1,
            snap: {
              snapTo: 1 / steps,
              duration: 0.4,
              ease: 'power1.inOut',
            },
            // finale sits on top of the whole sequence the entire time
            // (see the .finale-panel CSS comment), so its Continue button
            // must stay unclickable until it's actually the thing on
            // screen - otherwise it's clickable from scroll position zero.
            onUpdate: function (self) {
              finale.style.pointerEvents = self.progress > 0.98 ? 'auto' : 'none';
            },
            onLeave: holdAtEnd,
          },
        });

        // Beat 0: hero intro fades out while card 1 settles in, upright.
        var slot0 = restSlot(0);
        tl.to(hero, { opacity: 0, scale: 0.92, ease: 'none' }, 0)
          .to(cards[0], { opacity: 1, scale: 1, x: slot0.x, ease: 'none' }, 0);

        // Beats 1-6: each new card slides in from the right and lands
        // upright on top, while the card it's landing on tilts out of the
        // way into its resting fan angle at the same time.
        for (var i = 1; i < cards.length; i++) {
          var slot = restSlot(i);
          tl.to(cards[i], { x: slot.x, y: slot.y, ease: 'none' }, i)
            .to(cards[i - 1], { rotate: restSlot(i - 1).rotate, ease: 'none' }, i);
        }

        // Final beat: the fan slides up and off while the finale panel
        // (logo mark + closing tagline + Continue button) fades in.
        tl.to(fanStage, { yPercent: -130, opacity: 0, ease: 'none' }, cards.length)
          .to(finale, { opacity: 1, ease: 'none' }, cards.length);
      }

      // Mobile/no-JS/reduced-motion fallback: panels just stack and scroll
      // normally (see the @media/.reduced-motion CSS rules), no pinning.
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('reduced-motion');
        return;
      }

      // This script tag is the last thing in <body>, after two CDN
      // downloads - by the time it runs, 'load' may already have fired
      // (confirmed happening in testing). An addEventListener('load', ...)
      // attached after the event already fired silently never runs, so
      // check readyState first and only fall back to the listener if load
      // genuinely hasn't happened yet. A resize listener also retries in
      // case the viewport was transiently narrow the first time this ran.
      if (document.readyState === 'complete') {
        initPinSequence();
      } else {
        window.addEventListener('load', initPinSequence);
      }
      window.addEventListener('resize', initPinSequence);
    })();
  </script>
</body>
</html>
