markdown: kramdown
defaults:
  - scope:
      path: "rules"
    values:
      layout: "rules"
  - scope:
      path: "webbook"
    values:
      layout: "webbook"

# Jekyll replaces this list rather than adding to it, so its own defaults
# have to be repeated here or vendor/ starts getting published.
# archive/ is superseded working material, not the published game.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby
  - archive/
