<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>20 Below Brewer</title>
<link rel="stylesheet" href="brew.css" />
<style id="page-rule">@page { size: 8.5in 11in; margin: 0; }</style>
<script src="../vendor/marked.min.js"></script>
</head>
<body>

<div id="bar">
  <div class="title">20 Below Brewer <span>markdown in, print-ready pages out</span></div>

  <button id="btn-new">New</button>
  <button id="btn-open">Open</button>
  <button id="btn-save">Save</button>
  <button id="btn-saveas">Save as</button>

  <span class="spacer"></span>

  <label>Trim
    <select id="sel-trim">
      <option value="letter">Letter 8.5 &times; 11</option>
      <option value="a4">A4 210 &times; 297</option>
      <option value="trade">US Trade 6 &times; 9</option>
      <option value="digest">Digest 5.5 &times; 8.5</option>
    </select>
  </label>
  <button id="btn-palette" aria-pressed="false">Full colour</button>
  <button id="btn-layout" aria-pressed="false">Digital</button>
  <label>Zoom
    <select id="sel-zoom">
      <option value="fit">Fit</option>
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>
  </label>
  <button id="btn-reference">Reference</button>
  <a class="btn-link" href="../license.html" target="_blank" rel="noopener">Licence</a>
  <button id="btn-print">Print / PDF</button>
  <span id="status"></span>
</div>

<div id="split">
  <textarea id="editor" spellcheck="false" placeholder="Paste your markdown here."></textarea>
  <div id="drag" title="Drag to resize"></div>
  <div id="preview" data-palette="colour" data-layout="digital"></div>
</div>

<input id="file" type="file" accept=".md,.markdown,.txt,text/markdown" hidden />

<script type="module">
/* Cache-busting for the module graph.
 *
 * A browser caches ES modules by URL, and a plain reload does not
 * refetch them - so an edit could sit on disk, be served correctly,
 * and still not appear. That bit us repeatedly.
 *
 * The entry module gets a version query, and every module passes its
 * own query down to whatever it imports (see main.js), so the whole
 * graph busts together. The value is the current time, so a reload
 * always runs what is on disk - the JS is about 30 KB in total, and
 * the fonts and CSS still cache normally.
 */
const v = Date.now();
import(`./main.js?v=${v}`);
</script>
</body>
</html>
