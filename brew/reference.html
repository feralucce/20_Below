<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Brewery - Reference</title>
<link rel="stylesheet" href="brew.css" />
<style id="page-rule">@page { size: 8.5in 11in; margin: 0; }</style>
<style>
  /* Reference is read-only: no editor, and the preview owns the window. */
  #split{display:block}
  #preview{height:100%}
</style>
<script src="../vendor/marked.min.js"></script>
</head>
<body>

<div id="bar">
  <div class="title">Reference <span>every marker, shown as source and result</span></div>
  <span class="spacer"></span>
  <button id="btn-palette" aria-pressed="false">Full colour</button>
  <label>Zoom
    <select id="sel-zoom">
      <option value="fit">Fit</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>
  </label>
  <a class="btn-link" href="../license.html" target="_blank" rel="noopener">Licence</a>
  <button id="btn-print">Print / PDF</button>
</div>

<div id="split">
  <div id="preview" data-theme="core" data-palette="colour" data-layout="digital"></div>
</div>

<script type="module">
/* Same cache-busting as index.html - see the note there. */
const v = Date.now();
/* Same pairing as index.html: the measuring code and the layout it
   measures ship together, so the stylesheet is busted with them. */
document.querySelector('link[rel="stylesheet"]').href = `brew.css?v=${v}`;
const q = `?v=${v}`;
const { render, spills } = await import(`./render.js${q}`);
const { guide } = await import(`./sample.js${q}`);

const preview = document.getElementById('preview');
/* Opened from the Brewery carrying the theme that was showing, so the
   reference reads in the look you are actually working in. Falls
   back to core when opened on its own. */
preview.dataset.theme = new URLSearchParams(location.search).get('theme') || 'core';

function fit() {
  const sel = document.getElementById('sel-zoom').value;
  if (sel !== 'fit') { preview.style.setProperty('--zoom', sel); return; }
  const page = preview.querySelector('.page');
  if (!page) return;
  const natural = page.offsetWidth * (parseFloat(getComputedStyle(page).zoom) || 1);
  const avail = preview.clientWidth - 40;
  preview.style.setProperty('--zoom', natural ? Math.min(1, avail / natural).toFixed(3) : 1);
}

render(guide(), preview);
fit();

/* The guide is hand-paginated, so a section added to it can push its page
   past the sheet - and a page that overflows does not grow, it opens a
   further column sideways where the page's own overflow:hidden clips it.
   Nothing looks wrong; text is simply gone.
 *
 * This page had no check at all. The editor flags an overflowing page in
 * red and the reference did not, so the one document guaranteed to be
 * edited by whoever changes the layout engine was the one document that
 * could lose text without saying so. It measures itself now, unzoomed,
 * the way the editor does - print always renders at zoom 1, so that is
 * the only measurement that answers the question. */
(async function flagOverflow() {
  /* After the webfonts, always. They load lazily and change how tall
     everything is, so measuring before they arrive lays the text out in
     fallback metrics and more appears to fit than really does - this
     check reported a clean guide the first time it was written, on a
     page that was already clipping. The same rule autopage.js follows. */
  await document.fonts.ready;
  const shown = preview.style.getPropertyValue('--zoom');
  preview.style.setProperty('--zoom', '1');
  let over = 0;
  for (const page of preview.querySelectorAll('.page')) {
    const bad = spills(page);
    page.classList.toggle('overflowing', bad);
    if (bad) over += 1;
  }
  if (shown) preview.style.setProperty('--zoom', shown);
  if (over) {
    console.warn(
      over + ' page' + (over === 1 ? '' : 's') +
      ' of the reference overflow the sheet - text is being clipped. ' +
      'Add a \page in sample.js.');
  }
})();

window.addEventListener('resize', fit);
document.getElementById('sel-zoom').onchange = fit;
document.getElementById('btn-print').onclick = () => window.print();
document.getElementById('btn-palette').onclick = (e) => {
  const grey = preview.dataset.palette !== 'grey';
  preview.dataset.palette = grey ? 'grey' : 'colour';
  e.target.textContent = grey ? 'Greyscale' : 'Full colour';
  e.target.setAttribute('aria-pressed', String(grey));
};
</script>
</body>
</html>
