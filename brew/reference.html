<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Brewery - Reference</title>
<link rel="stylesheet" href="brew.css" />
<style id="page-rule">@page { size: 8.5in 11in; margin: 0; }</style>
<style>
  /* Reference is read-only: no editor, and the preview owns the window. */
  #split{display:block}
  #preview{height:100%}
</style>
<script src="../vendor/marked.min.js"></script>
</head>
<body>

<div id="bar">
  <div class="title">Reference <span>every marker, shown as source and result</span></div>
  <span class="spacer"></span>
  <button id="btn-palette" aria-pressed="false">Full colour</button>
  <label>Zoom
    <select id="sel-zoom">
      <option value="fit">Fit</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
    </select>
  </label>
  <a class="btn-link" href="../license.html" target="_blank" rel="noopener">Licence</a>
  <button id="btn-print">Print / PDF</button>
</div>

<div id="split">
  <div id="preview" data-palette="colour" data-layout="digital"></div>
</div>

<script type="module">
/* Same cache-busting as index.html - see the note there. */
const v = Date.now();
const q = `?v=${v}`;
const { render } = await import(`./render.js${q}`);
const { guide } = await import(`./sample.js${q}`);

const preview = document.getElementById('preview');

function fit() {
  const sel = document.getElementById('sel-zoom').value;
  if (sel !== 'fit') { preview.style.setProperty('--zoom', sel); return; }
  const page = preview.querySelector('.page');
  if (!page) return;
  const natural = page.offsetWidth * (parseFloat(getComputedStyle(page).zoom) || 1);
  const avail = preview.clientWidth - 40;
  preview.style.setProperty('--zoom', natural ? Math.min(1, avail / natural).toFixed(3) : 1);
}

render(guide(), preview);
fit();

window.addEventListener('resize', fit);
document.getElementById('sel-zoom').onchange = fit;
document.getElementById('btn-print').onclick = () => window.print();
document.getElementById('btn-palette').onclick = (e) => {
  const grey = preview.dataset.palette !== 'grey';
  preview.dataset.palette = grey ? 'grey' : 'colour';
  e.target.textContent = grey ? 'Greyscale' : 'Full colour';
  e.target.setAttribute('aria-pressed', String(grey));
};
</script>
</body>
</html>
